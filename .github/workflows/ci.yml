name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, test & detekt
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest já traz o Android SDK preinstalado.
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Detekt
        run: ./gradlew detektAll --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwndroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish test reports to summary
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/*/TEST-*.xml'
          require_tests: false

  pcap-validation:
    name: PCAP golden validation
    runs-on: ubuntu-latest
    container:
      # hcxpcapngtool + hashcat: valida que os fixtures de pcap da
      # :core:capture continuam convertendo para hashes 22000 crackeáveis.
      image: kalilinux/kali-rolling
    steps:
      - name: Install capture tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq hcxtools hashcat git >/dev/null

      - name: Checkout
        run: |
          git clone --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" repo
          cd repo && git fetch --depth 1 origin "$GITHUB_SHA" && git checkout "$GITHUB_SHA"

      - name: Validate golden pcap (hcxpcapngtool + hashcat -m 22000)
        run: bash scripts/validate-pcap.sh
        working-directory: repo