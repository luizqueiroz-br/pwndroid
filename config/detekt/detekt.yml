build:
  maxIssues: 0

style:
  MagicNumber:
    # Domínio de rádio usa constantes numéricas inline (RSSI, TTLs, canais);
    # os nomes dos parâmetros já documentam o significado.
    active: false
  ReturnCount:
    active: false
naming:
  FunctionNaming:
    # Composables Compose são PascalCase por convenção.
    ignoreAnnotated: ['Composable']
complexity:
  LongParameterList:
    # Builder fluente do FakeRadioBackend usa >6 parâmetros com defaults;
    # SessionController leva o grafo da sessão no construtor.
    functionThreshold: 8
    constructorThreshold: 9
exceptions:
  TooGenericExceptionCaught:
    active: false